[project]
name = "commonapi-workspace"
version = "0.0.0"
description = "Workspace root for yourco-observability, yourco-fastapi, and example services."
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "examples/*"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
