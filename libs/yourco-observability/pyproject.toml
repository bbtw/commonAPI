[project]
name = "yourco-observability"
version = "0.1.0"
description = "Structured logging, tracing, and metrics toolkit for yourco services."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yourco_observability"]
