[project]
name = "demo-service"
version = "0.1.0"
description = "Reference service that exercises yourco-observability and yourco-fastapi."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "yourco-observability",
    "yourco-fastapi",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_service"]

[tool.uv.sources]
yourco-observability = { workspace = true }
yourco-fastapi = { workspace = true }
